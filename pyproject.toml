[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nakivo_automation_platform"
version = "1.0.0"
description = "Enterprise-grade SDET Test Automation Platform for NAKIVO Backup & Replication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.20.0",
    "pytest>=8.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.5.0",
    "allure-pytest>=2.13.5",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
