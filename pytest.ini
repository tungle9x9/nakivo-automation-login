[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --alluredir=reports/allure-results
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml

markers =
    smoke: Quick smoke tests for critical user journeys
    regression: Comprehensive regression suite
    critical: High priority critical path tests
    negative: Negative testing scenarios
    edge_case: Boundary and edge-case testing
    data_driven: Dynamic parameter-driven testing from external CSV
    ui: Visual and interaction state verification
    security: Client-side credential sanitization and masking verification
